---
# Minimal stub of the upstream Cluster API MachineSet CRD, for envtest only.
# See test/crd/README.md. Never apply this to a real cluster.
#
# The real MachineSet CRD has status and scale subresources and several required
# spec fields. They are omitted because the reconciler only lists MachineSets and
# reads spec.template.spec.bootstrap.configRef.name and
# spec.template.spec.infrastructureRef.name.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinesets.cluster.x-k8s.io
spec:
  group: cluster.x-k8s.io
  names:
    kind: MachineSet
    listKind: MachineSetList
    plural: machinesets
    singular: machineset
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Test-only permissive stub of MachineSet.
          type: object
          x-kubernetes-preserve-unknown-fields: true
